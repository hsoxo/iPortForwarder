name: Build On Push

on:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  APP_NAME: iPortForwarder

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build xcframework
        run: sh build-xcframework.sh

      - name: Archive app
        run: |
          cd ui
          xcodebuild archive \
            -scheme iPortForwarder \
            -archivePath build.xcarchive \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual

      - name: Package zip
        run: |
          ditto -c -k --keepParent \
            "ui/build.xcarchive/Products/Applications/${APP_NAME}.app" \
            "${APP_NAME}.zip"

      - name: Package dmg
        run: |
          brew install graphicsmagick imagemagick
          npm install --global create-dmg
          create-dmg "ui/build.xcarchive/Products/Applications/${APP_NAME}.app" || true
          if ls ${APP_NAME}*.dmg >/dev/null 2>&1; then
            mv ${APP_NAME}*.dmg "${APP_NAME}.dmg"
          else
            hdiutil create \
              -volname "${APP_NAME}" \
              -srcfolder "ui/build.xcarchive/Products/Applications/${APP_NAME}.app" \
              -ov \
              -format UDZO \
              "${APP_NAME}.dmg"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iPortForwarder
          path: |
            ${{ github.workspace }}/${{ env.APP_NAME }}.zip
            ${{ github.workspace }}/${{ env.APP_NAME }}.dmg
