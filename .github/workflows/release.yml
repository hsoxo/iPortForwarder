name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.2'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: iPortForwarder

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build xcframework
        run: sh build-xcframework.sh

      - name: Archive app
        run: |
          cd ui
          xcodebuild archive \
            -scheme iPortForwarder \
            -archivePath build.xcarchive \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual

      - name: Package zip
        run: |
          ditto -c -k --keepParent \
            "ui/build.xcarchive/Products/Applications/${APP_NAME}.app" \
            "${APP_NAME}.zip"

      - name: Package dmg
        run: |
          brew install graphicsmagick imagemagick
          npm install --global create-dmg
          create-dmg "ui/build.xcarchive/Products/Applications/${APP_NAME}.app" || true
          if ls ${APP_NAME}*.dmg >/dev/null 2>&1; then
            mv ${APP_NAME}*.dmg "${APP_NAME}.dmg"
          else
            hdiutil create \
              -volname "${APP_NAME}" \
              -srcfolder "ui/build.xcarchive/Products/Applications/${APP_NAME}.app" \
              -ov \
              -format UDZO \
              "${APP_NAME}.dmg"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/${{ env.APP_NAME }}.zip
            ${{ github.workspace }}/${{ env.APP_NAME }}.dmg
